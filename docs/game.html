<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arena Dominion</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;background:#05070c;font-family:Segoe UI,Arial;color:#eee;overflow:hidden}
canvas{display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);z-index:10}
button{background:#1e1e1e;border:2px solid #666;color:#fff;padding:14px 26px;margin:10px;font-size:18px;border-radius:10px;cursor:pointer}
button:hover{background:#2a2a2a}
#ui{position:absolute;top:12px;left:12px;font-size:14px;line-height:1.5}
#shop{display:none}
.shopBox{background:#10131a;border:2px solid #666;padding:20px;border-radius:14px;width:460px;text-align:center}
.shopItem{border:1px solid #444;padding:10px;margin:8px 0;border-radius:8px;cursor:pointer;background:#0b0e14}
.shopItem.sold{opacity:.35;pointer-events:none}
.small{font-size:13px;color:#bbb}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="ui"></div>

<div id="menu" class="overlay">
<h1>⚔ Arena Dominion ⚔</h1>
<button onclick="startGame()">Start Game</button>
</div>

<div id="shop" class="overlay">
<div class="shopBox">
<h2>Armory</h2>
<div id="goldText"></div>
<div id="shopItems"></div>
<button onclick="restock()">Restock (+<span id="restockCost"></span>g)</button>
<button onclick="closeShop()">Next Round</button>
</div>
</div>

<script>
/* ================= AUDIO ================= */
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playMusic(){
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sawtooth";o.frequency.value=110;
 g.gain.value=.02;
 o.connect(g).connect(audioCtx.destination);
 o.start();
}
document.addEventListener("click",()=>audioCtx.resume(),{once:true});

/* ================= CANVAS ================= */
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();addEventListener("resize",resize);

/* ================= INPUT ================= */
const keys={},mouse={x:0,y:0,down:false};
addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("mousemove",e=>{mouse.x=e.clientX;mouse.y=e.clientY});
addEventListener("mousedown",()=>mouse.down=true);
addEventListener("mouseup",()=>mouse.down=false);

/* ================= STATE ================= */
let running=false,inShop=false,round=1;
const arenaPadding=90;

/* ================= PLAYER ================= */
const player={x:0,y:0,speed:4,hp:120,maxHp:120,gold:40,weapon:"Pistol",iframes:0};

/* ================= WEAPONS ================= */
const weapons={
 Pistol:{type:"bullet",damage:12,rate:280,level:1,price:0,desc:"Reliable sidearm."},
 Shotgun:{type:"shotgun",damage:6,pellets:7,spread:.7,rate:720,level:0,price:30,desc:"Close range burst."},
 SMG:{type:"bullet",damage:4,rate:80,level:0,price:35,desc:"Rapid fire."},
 Sniper:{type:"bullet",damage:45,rate:950,level:0,price:55,desc:"High precision."},
 Laser:{type:"laser",damage:9,burst:7,rate:420,level:0,price:45,desc:"Piercing beam."},
 Flame:{type:"flame",dps:38,range:160,cone:.75,burn:14,level:0,price:60,desc:"Cone fire damage."},
 Frost:{type:"frost",damage:8,rate:260,slow:.35,level:0,price:45,desc:"Slows enemies."},
 Poison:{type:"poison",damage:6,rate:260,poison:150,level:0,price:45,desc:"Damage over time."},
 Railgun:{type:"laser",damage:30,burst:2,rate:900,level:0,price:70,desc:"Heavy laser."},
 Arc:{type:"arc",damage:8,rate:240,chains:3,level:0,price:55,desc:"Chain lightning."},
 Mine:{type:"mine",damage:55,rate:900,level:0,price:45,desc:"Explosive trap."},
 Boomerang:{type:"bullet",damage:15,rate:520,level:0,price:40,desc:"Returns to you."},
 Chaos:{type:"bullet",damage:12,rate:200,level:0,price:65,desc:"Random effects."}
};
const shopPool=Object.keys(weapons).filter(w=>w!=="Pistol");

/* ================= ENEMIES / BOSSES ================= */
let enemies=[],bullets=[],lasers=[],mines=[];
function makeEnemy(){
 return{
  x:Math.random()*(canvas.width-240)+120,
  y:Math.random()*(canvas.height-240)+120,
  hp:110+round*26,
  speed:1.2+round*.06,
  dmg:9+round*.45,
  r:20,burn:0,slow:1,poison:0,isBoss:false
 };
}
function makeBoss(){
 return{
  x:canvas.width/2,
  y:canvas.height/2,
  hp:1200+round*120,
  speed:0.9+round*.02,
  dmg:20+round,
  r:48,
  burn:0,slow:1,poison:0,
  isBoss:true
 };
}
function spawnEnemies(){
 enemies=[];
 if(round%10===0){
  enemies.push(makeBoss());
 }else{
  for(let i=0;i<5+round;i++) enemies.push(makeEnemy());
 }
}

/* ================= MENU ================= */
function startGame(){
 document.getElementById("menu").style.display="none";
 running=true;
 player.x=canvas.width/2;player.y=canvas.height/2;
 playMusic();
 spawnEnemies();
}

/* ================= SHOP ================= */
const shopDiv=document.getElementById("shop");
const shopItemsDiv=document.getElementById("shopItems");
const goldText=document.getElementById("goldText");
const restockCostSpan=document.getElementById("restockCost");
let restockCost=5;

function openShop(){inShop=true;shopDiv.style.display="flex";buildShop()}
function closeShop(){inShop=false;shopDiv.style.display="none";round++;spawnEnemies()}
function buildShop(){
 shopItemsDiv.innerHTML="";
 goldText.textContent="Gold: "+player.gold;
 restockCostSpan.textContent=restockCost;
 [...shopPool].sort(()=>Math.random()-.5).slice(0,3).forEach(name=>{
  const w=weapons[name];
  const price=Math.floor(w.price*(1+w.level*.4));
  const div=document.createElement("div");
  div.className="shopItem";
  div.innerHTML=`<b>${name}</b> – ${price}g<br><span class="small">${w.desc}</span>`;
  div.onclick=()=>{
   if(player.gold<price) return;
   player.gold-=price;
   if(player.weapon===name) w.level++; else player.weapon=name;
   div.classList.add("sold");
   div.innerHTML+="<br><b>SOLD</b>";
   goldText.textContent="Gold: "+player.gold;
  };
  shopItemsDiv.appendChild(div);
 });
}
function restock(){if(player.gold<restockCost)return;player.gold-=restockCost;restockCost+=5;buildShop()}

/* ================= SHOOTING ================= */
let lastShot=0;
function shoot(){
 const w=weapons[player.weapon];
 const now=Date.now();
 if(now-lastShot<w.rate) return;
 lastShot=now;
 const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
 const dmg=(w.damage||0)*(1+w.level*.5);

 if(w.type==="bullet"){
  bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*9,vy:Math.sin(a)*9,dmg});
 }
 if(w.type==="shotgun"){
  for(let i=0;i<w.pellets;i++){
   const sa=a+(Math.random()-.5)*w.spread;
   bullets.push({x:player.x,y:player.y,vx:Math.cos(sa)*8,vy:Math.sin(sa)*8,dmg});
  }
 }
 if(w.type==="laser"){
  lasers.push({angle:a,frames:w.burst,dmg});
 }
 if(w.type==="mine"){
  mines.push({x:player.x,y:player.y,t:120,dmg});
 }
}

/* ================= UPDATE ================= */
function update(){
 if(!running||inShop) return;

 const mx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0);
 const my=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0);
 player.x+=mx*player.speed;player.y+=my*player.speed;
 player.x=Math.max(arenaPadding,Math.min(canvas.width-arenaPadding,player.x));
 player.y=Math.max(arenaPadding,Math.min(canvas.height-arenaPadding,player.y));
 if(player.iframes>0) player.iframes--;

 if(mouse.down){
  if(weapons[player.weapon].type==="flame"){
   const w=weapons.Flame;
   const a=Math.atan2(mouse.y-player.y,mouse.x-player.x);
   enemies.forEach(e=>{
    const dx=e.x-player.x,dy=e.y-player.y;
    const d=Math.hypot(dx,dy);
    const diff=Math.abs(Math.atan2(dy,dx)-a);
    if(d<w.range&&diff<w.cone){
     e.hp-=(w.dps*(1+w.level*.4))/60;
     e.burn=60;
    }
   });
  } else shoot();
 }

 bullets.forEach(b=>{
  b.x+=b.vx;b.y+=b.vy;
  enemies.forEach(e=>{
   if(Math.hypot(b.x-e.x,b.y-e.y)<e.r){
    e.hp-=b.dmg;
    b.dead=true;
   }
  });
 });
 bullets=bullets.filter(b=>!b.dead);

 lasers.forEach(l=>{
  const lx=Math.cos(l.angle),ly=Math.sin(l.angle);
  enemies.forEach(e=>{
   const ex=e.x-player.x,ey=e.y-player.y;
   if(ex*lx+ey*ly>0&&Math.abs(ex*ly-ey*lx)<e.r) e.hp-=l.dmg;
  });
  l.frames--;
 });
 lasers=lasers.filter(l=>l.frames>0);

 enemies.forEach(e=>{
  const d=Math.hypot(player.x-e.x,player.y-e.y);
  e.x+=(player.x-e.x)/d*(e.speed*e.slow);
  e.y+=(player.y-e.y)/d*(e.speed*e.slow);
  if(e.burn>0){e.hp-=weapons.Flame.burn/60;e.burn--}
  if(d<e.r+18&&player.iframes===0){player.hp-=e.dmg;player.iframes=40}
 });

 enemies=enemies.filter(e=>{
  if(e.hp<=0){
   player.gold+=e.isBoss?150:9;
   return false;
  }
  return true;
 });

 if(player.hp<=0) location.reload();
 if(!enemies.length) openShop();
}

/* ================= DRAW ================= */
function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!running) return;

 const g=ctx.createRadialGradient(canvas.width/2,canvas.height/2,50,canvas.width/2,canvas.height/2,canvas.width);
 g.addColorStop(0,"#0b1220");g.addColorStop(1,"#03050a");
 ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);

 ctx.strokeStyle="#1f2a44";ctx.lineWidth=6;
 ctx.strokeRect(arenaPadding,arenaPadding,canvas.width-arenaPadding*2,canvas.height-arenaPadding*2);

 bullets.forEach(b=>{ctx.fillStyle="#ffd84a";ctx.beginPath();ctx.arc(b.x,b.y,3,0,7);ctx.fill()});
 lasers.forEach(l=>{ctx.strokeStyle="#4ef";ctx.lineWidth=3;ctx.beginPath();
 ctx.moveTo(player.x,player.y);
 ctx.lineTo(player.x+Math.cos(l.angle)*canvas.width,player.y+Math.sin(l.angle)*canvas.width);ctx.stroke()});

 const pg=ctx.createRadialGradient(player.x,player.y,4,player.x,player.y,20);
 pg.addColorStop(0,"#7cf");pg.addColorStop(1,"#248");
 ctx.fillStyle=pg;ctx.beginPath();ctx.arc(player.x,player.y,18,0,7);ctx.fill();

 enemies.forEach(e=>{
  const eg=ctx.createRadialGradient(e.x,e.y,6,e.x,e.y,e.r);
  eg.addColorStop(0,e.isBoss?"#ffdd55":"#ff6b6b");
  eg.addColorStop(1,"#500");
  ctx.fillStyle=eg;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();
 });

 document.getElementById("ui").innerHTML=
 `Round ${round}${round%10===0?" (BOSS)":""}<br>HP ${player.hp}/${player.maxHp}<br>Gold ${player.gold}<br>Weapon ${player.weapon}`;
}

/* ================= LOOP ================= */
function loop(){update();draw();requestAnimationFrame(loop)}
loop();
</script>
</body>
</html>
